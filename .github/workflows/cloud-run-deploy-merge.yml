# Deploy Django blog to Cloud Run + Firebase Hosting CDN (parallel to Hugo on preview channel).
# Blue-green: new revision gets 0% traffic until /health/ passes, then 100%.
# Live matheusthurler.com.br: Firebase CDN → Cloud Run. Hugo: channel hugo-backup.
# Secrets: FIREBASE_SERVICE_ACCOUNT_MATHEUS_CLOUD_PESSOAL (same GCP project SA)

name: Deploy Django to Cloud Run on merge

on:
  push:
    branches:
      - django-migration
    paths:
      - 'django_site/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'hosting/**'
      - 'scripts/firebase-deploy.sh'
      - '.github/workflows/cloud-run-deploy-merge.yml'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: matheus-cloud-pessoal
  GCP_REGION: southamerica-east1
  AR_REPOSITORY: matheus-blog
  IMAGE_NAME: django
  CLOUD_RUN_SERVICE: matheus-blog
  DEPLOY_TAG: candidate

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MATHEUS_CLOUD_PESSOAL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: django_site
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy new revision with tag + 0% production traffic (current revision keeps 100%)
      - name: Deploy candidate revision (no traffic)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          tag: ${{ env.DEPLOY_TAG }}
          no_traffic: true
          flags: '--min-instances=1'

      # Real readiness = app responds (migrate + collectstatic + gunicorn). gcloud Ready filter is unreliable.
      - name: Smoke test candidate revision
        id: smoke
        run: |
          set -euo pipefail
          SERVICE="${{ env.CLOUD_RUN_SERVICE }}"
          REGION="${{ env.GCP_REGION }}"
          TAG="${{ env.DEPLOY_TAG }}"

          CANDIDATE_URL="$(gcloud run services describe "$SERVICE" --region="$REGION" --format='json' \
            | python3 -c "
          import json, sys
          tag = '${TAG}'
          data = json.load(sys.stdin)
          for entry in data.get('status', {}).get('traffic', []):
              if entry.get('tag') == tag and entry.get('url'):
                  print(entry['url'])
                  sys.exit(0)
          base = data.get('status', {}).get('url', '')
          if base.startswith('https://'):
              host = base[len('https://'):]
              print(f'https://{tag}---{host}')
          ")"

          echo "Candidate URL: ${CANDIDATE_URL}"
          echo "candidate_url=${CANDIDATE_URL}" >> "$GITHUB_OUTPUT"

          echo "Waiting for candidate /health/ (migrate + collectstatic may take several minutes)..."
          for attempt in $(seq 1 60); do
            if body="$(curl -fsS --max-time 20 "${CANDIDATE_URL}/health/" 2>/dev/null)" && echo "$body" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "Health OK: $body"
              exit 0
            fi
            echo "Attempt ${attempt}/60: not ready yet"
            sleep 10
          done

          echo "::error::Candidate smoke test failed — production traffic unchanged"
          REV="$(gcloud run revisions list --service="$SERVICE" --region="$REGION" \
            --format='value(metadata.name)' --limit=1 --sort-by='~metadata.creationTimestamp')"
          echo "Latest revision: ${REV}"
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${SERVICE} AND resource.labels.revision_name=${REV}" \
            --limit=30 --format='value(textPayload)' 2>/dev/null || true
          exit 1

      # Shift 100% traffic to candidate; min-instances=1 keeps one container warm (no ~17s cold start)
      - name: Promote candidate to 100% traffic
        run: |
          gcloud run services update-traffic "${{ env.CLOUD_RUN_SERVICE }}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --to-tags "${{ env.DEPLOY_TAG }}=100"

          gcloud run services update "${{ env.CLOUD_RUN_SERVICE }}" \
            --region "${{ env.GCP_REGION }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --min-instances 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Prerender public pages for Firebase CDN
        working-directory: django_site
        run: |
          uv sync --frozen
          PROD_URL="$(gcloud run services describe "${{ env.CLOUD_RUN_SERVICE }}" \
            --region "${{ env.GCP_REGION }}" \
            --format 'value(status.url)')"
          uv run python manage.py prerender_pages --base-url "${PROD_URL}"

      - name: Deploy Firebase Hosting (CDN → Cloud Run)
        run: bash scripts/firebase-deploy.sh

      - name: Verify production endpoints
        run: |
          set -euo pipefail
          PROD_URL="$(gcloud run services describe "${{ env.CLOUD_RUN_SERVICE }}" \
            --region "${{ env.GCP_REGION }}" \
            --format 'value(status.url)')"

          echo "Production URL: ${PROD_URL}"

          for attempt in $(seq 1 12); do
            if curl -fsS "${PROD_URL}/health/" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              break
            fi
            sleep 5
          done

          curl -fsS "${PROD_URL}/health/" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'
          echo "✓ /health/"

          curl -fsS "${PROD_URL}/ads.txt" | grep -q 'pub-3348120452456400'
          echo "✓ /ads.txt"

          code="$(curl -sS -o /dev/null -w '%{http_code}' "${PROD_URL}/posts/")"
          echo "posts: ${code}"
          test "$code" = "200"
          echo "✓ /posts/"

          FB_URL="https://matheus-cloud-pessoal.web.app"
          for attempt in $(seq 1 12); do
            if curl -fsS "${FB_URL}/health/" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              break
            fi
            sleep 5
          done
          curl -fsS "${FB_URL}/health/" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'
          echo "✓ Firebase CDN ${FB_URL}/health/"

      - name: Post-deploy integration sync
        continue-on-error: true
        env:
          INTERNAL_TOKEN: ${{ secrets.NEWSLETTER_INTERNAL_TOKEN }}
        run: |
          if [ -z "${INTERNAL_TOKEN}" ]; then
            echo "NEWSLETTER_INTERNAL_TOKEN not set — skipping sync"
            exit 0
          fi
          PROD_URL="$(gcloud run services describe "${{ env.CLOUD_RUN_SERVICE }}" \
            --region "${{ env.GCP_REGION }}" \
            --format 'value(status.url)')"
          curl -fsS -X POST "${PROD_URL}/internal/scheduler/sync/" \
            -H "X-Internal-Token: ${INTERNAL_TOKEN}" \
            -H "Content-Type: application/json"
          echo "✓ post-deploy sync triggered"
