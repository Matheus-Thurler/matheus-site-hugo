# Build Django container on PR (no deploy). Mirrors firebase-hosting-pull-request.yml.

name: Build Django for Cloud Run on PR

on:
  pull_request:
    paths:
      - 'django_site/**'
      - '.github/workflows/cloud-run-deploy-*.yml'

permissions:
  contents: read

env:
  GCP_PROJECT_ID: matheus-cloud-pessoal
  GCP_REGION: southamerica-east1
  AR_REPOSITORY: matheus-blog
  IMAGE_NAME: django

jobs:
  build_and_test:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        working-directory: django_site
        run: |
          uv sync --frozen --dev
          uv run pytest -q --ignore=tests/e2e -m "not e2e"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image (no push)
        uses: docker/build-push-action@v6
        with:
          context: django_site
          push: false
          tags: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
