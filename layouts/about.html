{{ define "main" }}
  <article class="article wrap-narrow">
    <header>
      {{ partial "yaml-meta.html" (dict "kind" (i18n "kind_about") "name" "about" "page" .) }}
      <h1 class="sr-only">{{ .Title }}</h1>
    </header>
    <div class="prose">
      {{ .Content }}
    </div>
  </article>
{{ end }}
