{{- $dest := .Destination | safeURL -}}
{{- $isAbs := or (hasPrefix $dest "http://") (hasPrefix $dest "https://") (hasPrefix $dest "//") -}}
{{- $src := $dest -}}
{{- if not $isAbs }}{{ $src = $dest | relURL }}{{ end -}}
<figure class="md-figure">
  <img
    src="{{ $src }}"
    alt="{{ .Text }}"
    {{- with .Title }} title="{{ . }}"{{ end }}
    loading="lazy"
    decoding="async" />
  {{- with .Title }}
    <figcaption>{{ . }}</figcaption>
  {{- end }}
</figure>
