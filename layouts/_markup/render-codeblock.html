{{ $lang := or .Type "text" }}
<div class="code-block">
  <div class="code-bar">
    <span class="code-lang">{{ $lang }}</span>
    <button
      type="button"
      class="copy-btn"
      data-copy
      data-label-copy="{{ i18n "copy" }}"
      data-label-copied="{{ i18n "copied" }}">
      {{ i18n "copy" }}
    </button>
  </div>
  {{ highlight .Inner $lang .Options }}
</div>
