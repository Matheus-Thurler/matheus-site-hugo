{% extends "blog/base.html" %}
{% load i18n %}

{% block title %}{{ page_title }} | {{ site_name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-4xl">
    <nav class="text-muted-foreground text-sm mb-6">
        <a href="{% url 'blog:home' %}" class="hover:text-primary">{% trans "Home" %}</a>
        <span class="mx-2">/</span>
        <span>{{ page_title }}</span>
    </nav>
    <h1 class="text-foreground text-3xl font-bold mb-8">{{ page_title }}</h1>
    <article class="prose prose-invert max-w-none">
        {{ page_content|safe }}
    </article>
</div>
{% endblock %}
