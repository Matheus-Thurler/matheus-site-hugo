{% extends "blog/base.html" %}

{% block title %}Tags | {{ site_name }}{% endblock %}

{% block content %}
<div class="mx-auto max-w-4xl">
    <h1 class="text-foreground text-3xl font-bold mb-8">Tags</h1>

    <div class="flex flex-wrap gap-3">
        {% for tag in tags %}
        <a href="{% url 'blog:tag' tag.slug %}" class="bg-muted/50 border-border hover:bg-primary/10 hover:border-primary/30 flex items-center gap-2 rounded-lg border px-4 py-2 text-sm font-medium transition-all hover:-translate-y-0.5">
            <span class="text-primary">#</span>{{ tag.name }}
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
