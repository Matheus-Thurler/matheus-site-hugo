{% if show_language_switch %}
<div class="relative">
  <button type="button" class="dropdown-toggle border-border bg-background text-muted-foreground hover:text-primary hover:bg-muted/60 focus:ring-primary/20 flex h-10 w-10 items-center justify-center rounded-lg border transition-all duration-300 ease-out hover:scale-105 focus:ring-2 focus:outline-none active:scale-95" data-dropdown-type="language" aria-label="Switch language" aria-expanded="false" aria-haspopup="true">
    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/>
    </svg>
  </button>

  <div class="dropdown-menu border-border bg-popover/95 absolute top-12 right-0 z-[60] hidden w-40 rounded-lg border p-1 shadow-lg backdrop-blur-sm transition-all duration-200 ease-out" data-dropdown-type="language" role="menu">
    {% if lang == 'en' %}
      <a href="{{ request.path }}" role="menuitem" class="text-accent-foreground hover:bg-accent hover:text-accent-foreground flex w-full items-center rounded-md px-4 py-2 text-sm transition-all duration-200 ease-out bg-accent">
        <span class="mr-2" aria-hidden="true">🇺🇸</span> English
      </a>
      <a href="/pt{{ request.path }}" role="menuitem" class="text-accent-foreground hover:bg-accent hover:text-accent-foreground flex w-full items-center rounded-md px-4 py-2 text-sm transition-all duration-200 ease-out">
        <span class="mr-2" aria-hidden="true">🇧🇷</span> Português
      </a>
    {% else %}
      <a href="{{ request.path|slice:'3:' }}" role="menuitem" class="text-accent-foreground hover:bg-accent hover:text-accent-foreground flex w-full items-center rounded-md px-4 py-2 text-sm transition-all duration-200 ease-out">
        <span class="mr-2" aria-hidden="true">🇺🇸</span> English
      </a>
      <a href="{{ request.path }}" role="menuitem" class="text-accent-foreground hover:bg-accent hover:text-accent-foreground flex w-full items-center rounded-md px-4 py-2 text-sm transition-all duration-200 ease-out bg-accent">
        <span class="mr-2" aria-hidden="true">🇧🇷</span> Português
      </a>
    {% endif %}
  </div>
</div>
{% endif %}
