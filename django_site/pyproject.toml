[project]
name = "matheus-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matheus Thurler", email = "matheusthurlernf@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bleach>=6.4.0",
    "cryptography>=49.0.0",
    "django>=6.0.7",
    "django-allauth>=65.18.0",
    "django-axes>=8.3.1",
    "django-ckeditor>=6.7.3",
    "django-csp>=4.0",
    "django-jazzmin>=3.0.5",
    "django-quill-editor>=0.1.42",
    "django-ratelimit>=4.1.0",
    "gunicorn>=23.0.0",
    "markdown>=3.10.2",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2.0",
    "pygments>=2.19.0",
    "pyjwt>=2.13.0",
    "requests>=2.32.0",
    "whitenoise>=6.9.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "feedparser>=6.0.0",
    "PyNaCl>=1.5.0",
]

[project.scripts]
matheus-blog = "matheus_blog:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest-django>=4.12.0",
    "pytest-playwright>=0.8.0",
]
