baseURL: https://matheusthurler.com.br/
languageCode: en-US
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
title: Matheus Thurler

hasCJKLanguage: false
enableEmoji: true
enableRobotsTXT: true
enableGitInfo: true
disableHugoGeneratorInject: true
timeZone: "America/Sao_Paulo"

permalinks:
  posts: /posts/:slug/
  pages: /:slug/

pagination:
  pagerSize: 6
  path: "page"

taxonomies:
  category: categories
  tag: tags

related:
  includeNewer: true
  threshold: 10
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 50

sitemap:
  changefreq: weekly
  filename: sitemap.xml
  priority: 0.5

privacy:
  youtube:
    privacyEnhanced: true
    disable: false

languages:
  en:
    languageCode: en-US
    languageName: "English"
    languageDirection: ltr
    weight: 1
    params:
      locale: en_US
      description: "Matheus Thurler — DevOps & Platform Engineer focused on Google Cloud. Tutorials and articles about Kubernetes, Terraform, CI/CD, SRE, and Platform Engineering."
  pt:
    languageCode: pt-BR
    languageName: "Português"
    languageDirection: ltr
    weight: 2
    params:
      locale: pt_BR
      description: "Matheus Thurler — DevOps & Platform Engineer focado em Google Cloud. Tutoriais e artigos sobre Kubernetes, Terraform, CI/CD, SRE e Platform Engineering."

params:
  description: "Matheus Thurler — DevOps & Platform Engineer focused on Google Cloud. Tutorials, articles, and content about Kubernetes, Terraform, CI/CD, SRE, and Platform Engineering."
  keywords: ["DevOps", "Google Cloud", "GCP", "Kubernetes", "Terraform", "Platform Engineering", "SRE", "CI/CD", "Matheus Thurler", "Infrastructure as Code", "VirtFoundry"]
  defaultAuthor: "Matheus Thurler"
  language: "en-US"
  shortName: "Matheus Thurler"
  images:
    - "/images/avatar.png"
  youtube: "https://youtube.com/@matheusthurler"
  virtfoundry: "https://github.com/virtfoundry"
  github: "https://github.com/Matheus-Thurler"
  linkedin: "https://linkedin.com/in/matheusthurler"
  email: "mailto:matheus@matheusthurler.com.br"
  themeColor: "#0c1116"

  logo:
    image: "/images/logo.svg"
    link: "/"
  favicon:
    svg: "/favicon.svg"

  virtfoundryUrl: "https://github.com/virtfoundry"

  author:
    name: "Matheus Thurler"
    title: "DevOps & Platform Engineer | Creator of VirtFoundry"
    description: "DevOps & Platform Engineer focused on Google Cloud, Infrastructure as Code, and SRE. Creator of VirtFoundry — an open-source Kubernetes-native IaaS control plane on KubeVirt."
    avatar: "/images/avatar.png"
    jobTitle: "DevOps & Platform Engineer"
    sameAs:
      - "https://github.com/Matheus-Thurler"
      - "https://youtube.com/@matheusthurler"
      - "https://linkedin.com/in/matheusthurler"

  newsletter:
    subscribeUrl: "https://us-central1-matheus-cloud-pessoal.cloudfunctions.net/subscribe"

  comments:
    enabled: true
    system: "giscus"
    giscus:
      repo: "Matheus-Thurler/matheus-site-hugo"
      repoId: "R_kgDOQYHuEQ"
      category: "Announcements"
      categoryId: "DIC_kwDOQYHuEc4Cx73e"
      mapping: "pathname"
      strict: "0"
      reactionsEnabled: "1"
      emitMetadata: "0"
      inputPosition: "bottom"
      theme: "transparent_dark"

  analytics:
    enabled: true
    google:
      enabled: true
      id: "G-G73F8VFQNC"

  googleAdsenseId: "pub-3348120452456400"

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      extras:
        delete:
          enable: true
        insert:
          enable: true
        mark:
          enable: true
        subscript:
          enable: false
        superscript:
          enable: false
      strikethrough: false
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: false
    lineNumbersInTable: false
    noClasses: false
    style: github-dark
    tabWidth: 2

outputs:
  home: ["HTML", "RSS", "WebAppManifest"]
  section: ["HTML", "RSS"]
  taxonomy: ["HTML", "RSS"]
  term: ["HTML", "RSS"]
  page: ["HTML"]

outputFormats:
  WebAppManifest:
    mediaType: "application/manifest+json"
    baseName: "site"
    isPlainText: true

module:
  hugoVersion:
    extended: true
    min: 0.146.0

deployment:
  targets:
    - name: production
      url: s3://matheus-site-nuxt?region=us-east-1
